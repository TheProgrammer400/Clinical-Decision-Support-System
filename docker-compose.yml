services:
  postgres:
    image: postgres:16-alpine
    container_name: cdss-postgres
    restart: always
    environment:
      POSTGRES_USER: cdss_user
      POSTGRES_PASSWORD: cdss_password
      POSTGRES_DB: cdss_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdss_user -d cdss_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cdss-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://cdss_user:cdss_password@postgres:5432/cdss_db?schema=public
      JWT_ACCESS_SECRET: dev_jwt_access_secret_key_change_in_production_12345
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_key_change_in_production_67890
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 1209600
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_mock_key_for_dev_testing}
      GROQ_MODEL_NAME: openai/gpt-oss-120b
      GROQ_REQUEST_TIMEOUT_MS: 60000
      PROMPT_VERSION: v1.4.0
      LOG_LEVEL: debug
      MRI_INFERENCE_SERVICE_URL: http://mri-inference:8000
    depends_on:
      postgres:
        condition: service_healthy

  mri-inference:
    build:
      context: ./mri-inference-service
      dockerfile: Dockerfile
    container_name: cdss-mri-inference
    restart: always
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: models/unet.pth
      MODEL_VERSION: unet_v1.2.0
      MAX_CONCURRENT_INFERENCE: 1
      ALLOW_CPU_FALLBACK: "false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cdss-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
