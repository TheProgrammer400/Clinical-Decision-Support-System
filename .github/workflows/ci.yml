name: CDSS CI Pipeline

on:
  push:
    branches: [main, aws_migration]
  pull_request:
    branches: [main, aws_migration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit, e2e, migrations, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cdss_test
          POSTGRES_PASSWORD: cdss_test
          POSTGRES_DB: cdss_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cdss_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cdss_test:cdss_test@localhost:5432/cdss_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck (sources and tests)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Apply migrations to the test database
        run: sh scripts/migrate.sh
      - name: End-to-end tests (disposable PostgreSQL)
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://cdss_test:cdss_test@localhost:5432/cdss_test
      - name: Migration tests (fresh + legacy db-push baseline)
        run: sh scripts/test-migrations.sh
        env:
          ADMIN_URL: postgresql://cdss_test:cdss_test@localhost:5432/postgres
      - name: Build
        run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit/component tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  mri-inference:
    name: MRI inference service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mri-inference-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mri-inference-service/requirements*.txt
      - name: Install CPU-only torch (the CUDA build is not needed for tests)
        run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install remaining pinned dependencies
        run: pip install -r requirements.in -r requirements-dev.in
      - name: Tests
        run: python -m pytest -q

  docker:
    name: Docker image builds (backend, frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cdss-backend:ci ./backend
      - run: docker build -t cdss-frontend:ci ./frontend
