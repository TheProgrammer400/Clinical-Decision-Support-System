name: CDSS CI Pipeline

on:
  push:
    branches: [ main, aws_migration ]
  pull_request:
    branches: [ main, aws_migration ]


jobs:
  backend-test:
    name: Backend Unit Tests & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test

      - name: Build Backend
        run: |
          cd backend
          npm run build

  frontend-test:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Next.js App
        run: |
          cd frontend
          npm run build
