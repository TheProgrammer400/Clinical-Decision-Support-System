name: CDSS CD Pipeline

on:
  push:
    branches: [ main, aws_migration ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"


jobs:
  deploy:
    name: Build Docker Images & Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:

      - uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          echo "Raw response: $TOKEN"
          JWT=$(echo "$TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value','EMPTY'))")
          echo "JWT obtained: ${JWT:0:10}... (truncated)"
          PAYLOAD=$(echo "$JWT" | cut -d'.' -f2 | python3 -c "
import sys, base64, json
raw = sys.stdin.read().strip()
raw += '=' * (4 - len(raw) % 4)
claims = json.loads(base64.urlsafe_b64decode(raw))
print('iss:', claims.get('iss'))
print('sub:', claims.get('sub'))
print('aud:', claims.get('aud'))
print('repository:', claims.get('repository'))
print('ref:', claims.get('ref'))
")
          echo "$PAYLOAD"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::061179368899:role/CDSSGitHubDeployRole





      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/cdss-backend:$IMAGE_TAG -t $ECR_REGISTRY/cdss-backend:latest ./backend
          docker push $ECR_REGISTRY/cdss-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cdss-backend:latest

      - name: Build & Push Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/cdss-frontend:$IMAGE_TAG -t $ECR_REGISTRY/cdss-frontend:latest ./frontend
          docker push $ECR_REGISTRY/cdss-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cdss-frontend:latest

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster cdss-cluster-production --service cdss-backend-service --force-new-deployment
